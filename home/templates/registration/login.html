<!DOCTYPE html>
<html>
<head>
    <title>Login — Cornered Wisdom</title>
</head>

<body>

    <h1>Log in to Cornered Wisdom</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Log in</button>
    </form>


    <p>
    Don't have an account?
    <a>Create an account</a>
    <a href="{% url 'register' %}">here</a>
    <a>and begin building your house of wisdom in this corner of the web</a>
</p>

</body>
</html>

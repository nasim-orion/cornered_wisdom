<!DOCTYPE html>
<html>
<head>
    <title>Login — Cornered Wisdom</title>
</head>

<body>

    <h1>Log in to Cornered Wisdom</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Log in</button>
    </form>


    <p>
    Don't have an account?
    <a>Click</a>
    <a href="{% url 'about' %}">here</a>
    <a>to learn more about Cornered Wisdom, and then</a>
    <a>create an account</a>
    <a href="{% url 'register' %}">here</a>
    <a> when you're ready to begin building your house of wisdom in this corner of the web</a>
</p>

</body>
</html>

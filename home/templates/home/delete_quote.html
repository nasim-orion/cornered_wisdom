<!DOCTYPE html>
<html>
<head>
    <title>Delete Quote — Cornered Wisdom</title>
</head>

<body>

    <h1>Delete Quote</h1>

    <p>Are you sure you want to delete this quote?</p>

    <blockquote>
        “{{ quote.text }}”
    </blockquote>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <br>

    <a href="{% url 'my_quotes' %}">Cancel</a>

    <a href="{% url 'home' %}">Back to Home</a>
    <a href="{% url 'my_quotes' %}">Back to Your Quotes</a>

</body>
</html>

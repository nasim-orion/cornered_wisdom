{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'home/style.css' %}">
    <link rel="icon" type="image/png" href="{% static 'home/images/favicon.png' %}">
    <title>Add Your Quote — Cornered Wisdom</title>
</head>

<body>
    <div class="book-wrapper">
    <main class="book-page">

    <h1>Add a Quote</h1>

     {% if error %}
     <p>{{ error }}</p>
     {% endif %}
     <form method="post" class="quote-form">
        {% csrf_token %}
        <div class="form-field">

        <label>Quote:</label>
        <textarea name="text"required></textarea>

        </div>     
        
        <div class="form-field">
 
        <label>Book title:</label>
        <input type="text" required name="book_title" >

        </div>

        <div class="form-field">

        <label>Author:</label>
        <input type="text" name="author">
        </div>


         <div class="form-field">
          <label>Page number:</label>
          <input type="number" name="page_number" min="1">
          <small>Page number must be 1 or above.</small>
         </div>

         <div class="form-field">
          
        <label>Notes:</label>
        <textarea name="notes"></textarea>

        </div>

        <button type="submit">Add Quote</button>
    </form>

    <a class="back-link" href="{% url 'home' %}">Back to Home</a>
 
    </div>
</main>

</body>
</html>
